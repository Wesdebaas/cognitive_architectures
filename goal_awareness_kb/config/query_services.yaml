# Each entry creates a ROS service backed by a SPARQL query file from the
# queries/ directory.

query_services:
  count_triples:
    query_file: count_triples.sparql
    reasoning: false

  all_triples:
    query_file: get_all_triples.sparql
    reasoning: false

  semantic_edges:
    query_file: semantic_edges.sparql
    reasoning: false

  last_observed:
    query_file: last_observed.sparql
    reasoning: false

  missing_items:
    query_file: missing_items.sparql
    reasoning: false

  satisfied_goals:
    query_file: satisfied_goals.sparql
    reasoning: false

  item_locations:
    query_file: item_locations.sparql
    reasoning: false
