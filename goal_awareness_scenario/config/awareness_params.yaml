# Awareness manager tuning constants. Keep identical across all three scenarios 
# and across the AM-on / AM-off conditions.

# Relevance lost per hop in A = (1 - alpha)^d.
alpha: 0.3

# Seconds after an observation at which knowledge of an item is worthless.
# If factor between two values in one phase is <2, 
# it will cycle between the three stations. 
# If factor between two values in one phase is >4,
# the slowest station will be ignored.
staleness_time:
  rubbish: 240.0
  roast: 720.0
  place_setting: 2160.0
  juice: 900.0 # needs tuning
  wine: 900.0 # needs tuning
  # long on purpose to keep tv_cabinet out of the ranking, also realistic
  # because stock isn't changing as often
  spare_wine: 3600.0 # needs tuning
