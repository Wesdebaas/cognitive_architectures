# Seconds after which a belief about this item type is fully stale: E = min(1, dt / T).
# Chosen: hand-set, the same for both items.
T:
  breakfast_plate: 300
  cup: 300

# Relevance from w votes: A = 1 - e^(c*w), with c < 0.
# c = ln 0.9, so one vote gives A = 0.1. Chosen: 0.9.
c: -0.10536

# Votes borrowed from a parent class count as A = (1 - alpha) (1 - e^(c*w)), however many steps up.
# Chosen: 0.5.
alpha: 0.5

# Only actions with P at or above this value are considered; none -> the robot idles.
# Chosen: 0.2, as in the drinks scenario.
idle_threshold: 0.2
